services:
  postgres:
    image: postgres:16-alpine
    container_name: codetrail-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: codetrail
      POSTGRES_USER: codetrail
      POSTGRES_PASSWORD: codetrail
    ports:
      - "5544:5432"
    volumes:
      - codetrail-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U codetrail -d codetrail"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  codetrail-postgres-data:
